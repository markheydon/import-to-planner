name: CI E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ImportToPlanner.slnx

      - name: Build solution
        run: dotnet build ImportToPlanner.slnx --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/ImportToPlanner.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test tests/ImportToPlanner.E2E.Tests/ImportToPlanner.E2E.Tests.csproj --no-build --verbosity normal
