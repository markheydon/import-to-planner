name: Deploy Staging

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (ACA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Verify deploy commit is current main tip
        if: github.event_name == 'workflow_run'
        id: verify_tip
        shell: bash
        run: |
          DEPLOY_SHA='${{ github.event.workflow_run.head_sha }}'
          git fetch origin main --depth=1
          MAIN_TIP="$(git rev-parse origin/main)"
          if [ "$DEPLOY_SHA" != "$MAIN_TIP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: commit $DEPLOY_SHA is no longer the tip of main ($MAIN_TIP)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set deployment build metadata
        shell: bash
        run: echo "BUILD_TIMESTAMP_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Write MSBuild metadata for aspire deploy
        shell: bash
        run: |
          cat > Directory.Build.metadata.props <<EOF
          <Project>
            <PropertyGroup>
              <ContinuousIntegrationBuild>true</ContinuousIntegrationBuild>
              <SourceRevisionId>${{ github.sha }}</SourceRevisionId>
              <BuildTimestampUtc>${{ env.BUILD_TIMESTAMP_UTC }}</BuildTimestampUtc>
            </PropertyGroup>
          </Project>
          EOF

      - name: Restore dependencies
        run: >
          dotnet restore ImportToPlanner.slnx
          /p:ContinuousIntegrationBuild=true
          /p:SourceRevisionId=${{ github.sha }}
          /p:BuildTimestampUtc=${{ env.BUILD_TIMESTAMP_UTC }}

      - name: Install Aspire CLI
        shell: bash
        run: |
          dotnet tool install --global aspire.cli --version 13.6.0 \
            || dotnet tool update --global aspire.cli --version 13.6.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          aspire --version

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Aspire AppHost to staging
        if: github.event_name == 'workflow_dispatch' || steps.verify_tip.outputs.skip != 'true'
        shell: bash
        env:
          ASPIRE_CLI_TELEMETRY_OPTOUT: 1
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Parameters__azureAdTenantId: ${{ secrets.AZURE_TENANT_ID }}
          Parameters__azureAdClientId: ${{ secrets.AZURE_CLIENT_ID }}
          Parameters__azureAdHomeTenantId: ${{ vars.HOME_TENANT_ID }}
          Parameters__enableCommercialMode: ${{ vars.ENABLE_COMMERCIAL_MODE || 'false' }}
          Parameters__graphClientCertificatePassword: ${{ secrets.GRAPH_CLIENT_CERTIFICATE_PASSWORD }}
          Parameters__graphClientCertificateBase64: ${{ secrets.GRAPH_CLIENT_CERTIFICATE_BASE64 }}
          Parameters__customDomain: ${{ vars.CUSTOM_DOMAIN }}
          Parameters__customDomainCertificateName: ${{ vars.CUSTOM_DOMAIN_CERTIFICATE_NAME }}
        run: aspire deploy --environment Staging --non-interactive
