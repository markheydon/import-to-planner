version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "markheydon"
    groups:
      microsoft-graph:
        patterns:
          - "Microsoft.Graph*"
          - "Microsoft.Identity.Web*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      azure:
        patterns:
          - "Azure.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
      test-packages:
        patterns:
          - "xunit"
          - "xunit.*"
          - "Moq*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
      analyzers:
        patterns:
          - "*Analyzers*"
          - "Microsoft.CodeAnalysis.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    assignees:
      - "markheydon"
