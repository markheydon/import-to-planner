version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - type/chore
    assignees:
      - markheydon
    groups:
      test-packages:
        patterns:
          - xunit*
          - bunit
          - NSubstitute*
          - Microsoft.NET.Test.Sdk
          - coverlet*
        update-types:
          - minor
          - patch
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
        update-types:
          - minor
          - patch
      azure:
        patterns:
          - Azure.*
          - Microsoft.Azure.*
          - Aspire.*
        update-types:
          - minor
          - patch
      opentelemetry:
        patterns:
          - OpenTelemetry.*
        update-types:
          - minor
          - patch
      analyzers:
        patterns:
          - "*Analyzers*"
          - Microsoft.CodeAnalysis.*
        update-types:
          - minor
          - patch
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - type/chore
    assignees:
      - markheydon
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - type/chore
    assignees:
      - markheydon
    groups:
      devcontainers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
